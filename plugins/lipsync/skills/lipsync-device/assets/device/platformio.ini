; pixel-narrator device player: example firmware, unit tests, one project.
;
;   pio run -e sticks3 -e oled     build both examples (never add -t upload
;                                  without asking: a flash replaces what the
;                                  device runs)
;   pio test -e native             unit tests of lib/pnplayer on this machine
;
; Each firmware embeds one pack from packs/. Replace the file to change the
; line it speaks.

[platformio]
default_envs = sticks3, oled

; M5Stack StickS3 (ESP32-S3-PICO-1-N8R8: 8 MB flash, 8 MB octal PSRAM), the
; board settings of ~/git/stickos and ~/git/game-stickpet. 135x240 ST7789,
; RGB565, ES8311 codec and speaker, all through M5Unified.
[env:sticks3]
platform = espressif32@^6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
monitor_speed = 115200
build_src_filter = -<*> +<sticks3/>
board_build.embed_files = packs/demo.sticks3.pnpk
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  m5stack/M5Unified@^0.2.25
  m5stack/M5GFX@^0.2.31

; ESP32 DevKit with a 128x64 1-bit OLED on I2C (SDA 21, SCL 22, address
; 0x3C). SH1106 is the default, because the user's boards carry it; the
; pack is the same for SSD1306. No speaker: the frame follows the clock.
[env:oled]
platform = espressif32@^6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<oled/>
board_build.embed_files = packs/demo.oled.pnpk
build_flags = -DPN_OLED_SH1106 -DCORE_DEBUG_LEVEL=0
lib_deps = olikraus/U8g2@^2.36.5

; The same board with an SSD1306 panel.
[env:oled_ssd1306]
extends = env:oled
build_flags = -DPN_OLED_SSD1306 -DCORE_DEBUG_LEVEL=0

; The same board with an I2S amplifier (MAX98357A: BCLK 26, LRC 25, DIN 27).
; The frame then follows the samples played.
[env:oled_i2s]
extends = env:oled
build_flags = -DPN_OLED_SH1106 -DPN_I2S_SPEAKER -DCORE_DEBUG_LEVEL=0

[env:native]
platform = native
build_src_filter = -<*>
build_flags = -std=c11 -Wall -Wextra
